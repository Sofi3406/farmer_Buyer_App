name: farmer_buyer_marketplace
description: A Flutter marketplace app for farmers and buyers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  image_picker: ^1.0.5
  dio: ^5.3.2
  flutter_local_notifications: ^16.3.0
  intl: ^0.18.0
  # For Google Maps (optional)
  google_maps_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true